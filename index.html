<!DOCTYPE html>
<html>
<head>
<title>Troll Heart</title>
<style>
body {
margin: 0;
background: black;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
canvas {
display: block;
}
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let angle = 0;
function heart(t) {
let x = 16 * Math.sin(t) ** 3;
let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
return {x, y};
}
function draw() {
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.textAlign = "center";
ctx.textBaseline = "middle";
let scale = Math.min(canvas.width,canvas.height) / 38;
for(let i=0;i<500;i++) {
let t = Math.random() * Math.PI * 2;
let p = heart(t);
let depth = Math.random() * 2 - 1;
let x = p.x * scale;
let y = -p.y * scale;
let z = depth * 8;
let rx = x * Math.cos(angle) - z * Math.sin(angle);
let rz = x * Math.sin(angle) + z * Math.cos(angle);
let perspective = 400 / (400 + rz);
let screenX = canvas.width/2 + rx * perspective;
let screenY = canvas.height/2 + y * perspective;
ctx.font = (12 * perspective) + "px Arial";
ctx.fillStyle = "red";
ctx.fillText("FUCK YOU",screenX,screenY);
}
angle += 0.015;
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
